<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – Logistics Royal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Back to home -->
    <div class="mb-6">
      <a href="/" class="inline-flex items-center gap-1.5 text-slate-400 hover:text-white text-sm transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Home
      </a>
    </div>

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-600/30">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0v10l-8 4m0-14L4 17m8 4V11"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Logistics Royal</h1>
      <p class="text-slate-400 mt-1 text-sm">Logistics Management Platform</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
      <h2 class="text-xl font-semibold text-white mb-6">Sign in to your account</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="mb-5 p-3 bg-red-500/20 border border-red-500/40 rounded-lg text-red-300 text-sm">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
          <input name="username" type="text" required autocomplete="username"
            class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white
                   placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition text-sm"
            placeholder="Enter your username"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <input name="password" type="password" required autocomplete="current-password"
            class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white
                   placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition text-sm"
            placeholder="Enter your password"/>
        </div>
        <button type="submit"
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg
                 transition-colors duration-200 text-sm shadow-lg shadow-blue-600/30">
          Sign In →
        </button>
      </form>

      <div class="mt-5 pt-5 border-t border-slate-700 text-center">
        <p class="text-slate-400 text-xs">
          Don't have an account?
          <a href="/track" class="text-blue-400 hover:text-blue-300 transition">Track without login →</a>
        </p>
      </div>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">© 2025 Logistics Royal. All rights reserved.</p>
  </div>

</body>
</html>
